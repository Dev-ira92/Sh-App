name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: shso.keystore
          key: shso-keystore-v1

      - name: Create signing key (first time only)
        if: steps.ks.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -keystore shso.keystore -storepass shso123456 -keypass shso123456
          -alias shso -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sh-So, O=Sh-So, C=IR"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PshsoKeystore=${{ github.workspace }}/shso.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: Sh-So-debug-apk
          path: app/build/outputs/apk/debug/*.apk
