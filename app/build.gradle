plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shadow.society.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.shadow.society.app"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }
    signingConfigs {
        shso {
            if (project.hasProperty('shsoKeystore')) {
                storeFile file(project.property('shsoKeystore'))
                storePassword 'shso123456'
                keyAlias 'shso'
                keyPassword 'shso123456'
            }
        }
    }
    buildTypes {
        debug {
            if (project.hasProperty('shsoKeystore')) {
                signingConfig signingConfigs.shso
            }
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.scottyab:rootbeer-lib:0.1.0'
}
